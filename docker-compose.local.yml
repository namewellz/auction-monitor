# Local Windows persistence override. Application services and settings remain
# defined by docker-compose.yml, matching the production/Portainer stack.
services:
  postgres:
    ports: !override
      - "5433:5432"
    volumes: !override
      - postgres-data:/var/lib/postgresql/data

  minio:
    volumes: !override
      - minio-data:/data

  dashboard:
    build: .
    ports: !override
      - "3001:3000"
    environment:
      SUPERBID_CATALOG_MAX_OFFERS: 100
    labels:
      - com.centurylinklabs.watchtower.enable=false

  catalog-worker:
    build: .
    labels:
      - com.centurylinklabs.watchtower.enable=false

  collector:
    build: .

  auction-monitor:
    build: .

  watchtower:
    profiles:
      - production-only

volumes:
  postgres-data:
  minio-data:
