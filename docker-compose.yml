services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - /srv/auction-monitor/postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  minio:
    image: minio/minio:latest

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - ${MINIO_DATA_PATH:-/srv/auction-monitor/minio-data}:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  dashboard:
    image: ${APP_IMAGE:-ghcr.io/namewellz/auction-monitor:latest}

    labels:
      - com.centurylinklabs.watchtower.enable=true

    command:
      - node
      - dist/leiloApp.js


    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      MEDIA_DOWNLOAD_CONCURRENCY: ${MEDIA_DOWNLOAD_CONCURRENCY:-6}
      MEDIA_IMAGE_MAX_WIDTH: ${MEDIA_IMAGE_MAX_WIDTH:-1280}
      MEDIA_IMAGE_MAX_HEIGHT: ${MEDIA_IMAGE_MAX_HEIGHT:-960}
      MEDIA_IMAGE_QUALITY: ${MEDIA_IMAGE_QUALITY:-70}

      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}

      LEILO_API_URL: ${LEILO_API_URL}
      LEILO_MAX_PAGES: ${LEILO_MAX_PAGES:-20}

      CATALOG_COLLECTION_CRON: ${CATALOG_COLLECTION_CRON:-0 */6 * * *}
      CATALOG_COLLECT_ON_START: ${CATALOG_COLLECT_ON_START:-false}
      CATALOG_MAX_PAGES: ${CATALOG_MAX_PAGES:-60}

      VIP_REQUEST_INTERVAL_MS: ${VIP_REQUEST_INTERVAL_MS:-750}
      BRUNO_REQUEST_INTERVAL_MS: ${BRUNO_REQUEST_INTERVAL_MS:-750}
      CALIL_REQUEST_INTERVAL_MS: ${CALIL_REQUEST_INTERVAL_MS:-750}
      CAPITAL_VALOR_REQUEST_INTERVAL_MS: ${CAPITAL_VALOR_REQUEST_INTERVAL_MS:-750}
      D1_LANCE_REQUEST_INTERVAL_MS: ${D1_LANCE_REQUEST_INTERVAL_MS:-750}
      VLANCE_REQUEST_INTERVAL_MS: ${VLANCE_REQUEST_INTERVAL_MS:-750}
      FRANCO_REQUEST_INTERVAL_MS: ${FRANCO_REQUEST_INTERVAL_MS:-750}
      ALESSANDRO_REQUEST_INTERVAL_MS: ${ALESSANDRO_REQUEST_INTERVAL_MS:-750}
      ALVARO_REQUEST_INTERVAL_MS: ${ALVARO_REQUEST_INTERVAL_MS:-750}
      SUPERBID_REQUEST_INTERVAL_MS: ${SUPERBID_REQUEST_INTERVAL_MS:-750}
      SUPERBID_CATALOG_PAGE_SIZE: ${SUPERBID_CATALOG_PAGE_SIZE:-100}
      SUPERBID_CATALOG_MAX_OFFERS: ${SUPERBID_CATALOG_MAX_OFFERS:-0}

    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_PORT:-3000}"

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    restart: unless-stopped


  collector:
    image: ${APP_IMAGE:-ghcr.io/namewellz/auction-monitor:latest}

    labels:
      - com.centurylinklabs.watchtower.enable=true

    profiles:
      - multi-site

    command:
      - node
      - dist/collector.js


    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    restart: unless-stopped


  auction-monitor:
    image: ${APP_IMAGE:-ghcr.io/namewellz/auction-monitor:latest}

    labels:
      - com.centurylinklabs.watchtower.enable=true

    profiles:
      - telegram


    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  watchtower:
    image: nickfedor/watchtower:1.19.0

    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_TIMEOUT: 30s
      TZ: America/Sao_Paulo

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped
